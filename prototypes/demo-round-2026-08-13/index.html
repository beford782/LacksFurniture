<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DreamFinder — Nocturne demo prototype</title>
<!--
  FULLY FUNCTIONAL PROTOTYPE — demo-impact visual round, 2026-08-13.
  Revision 2: adds the Payment Choices layer (roughly half the commercial
  story) per owner correction — sleep fit first, payment choice second,
  and the two paths never touch.

  Isolated from production (lives under prototypes/, no domain lock, no
  writes) but everything shown is REAL:
    · questions load from ../../data/quiz.json (the shipped quiz)
    · the catalog loads from ../../data/mattresses.json
    · accessories load from ../../data/accessories.json
    · the ENTIRE financing layer reads ../../data/store-config.json
      (store-config.financing) — every payment string on screen is the
      governed config's own copy; nothing is hand-authored
    · calculateScores(), qualifyRankedChoices(), showProfileScreen() and
      scoreAccessoriesFromAnswers() are EXTRACTED VERBATIM from
      ../../index.html at runtime — the repo's test-harness technique —
      so every score, tier, top pick, profile, priority and accessory
      ranking is the production engine's own output
    · the financing GATING is also production's own code, extracted
      verbatim: financingTermsFresh, financingPlanFresh, financingAgeOk,
      financingSourceAllowed, finGroupedPlans, finPromotionalByProvider
      and their taxonomy constants — so exact rate/term claims render
      ONLY when production itself would render them (exactPromotionsEnabled
      AND verifiedAt+maxAgeDays fresh AND allowlisted https source). With
      today's config that means exact promotions AND the freshness-gated
      In-House / Mexico details are SUPPRESSED to the specialist-confirm
      staleNotice — exactly as deployed production behaves right now.
      No monthly payments are ever computed (V1 invariant).
  Payment state never enters scoring; quiz answers never alter the
  payment layer. The in-app Isolation Check (welcome screen) proves both
  directions live.
  Store name is demo config; production reads store-config.json.
-->
<style>
  /* ===== NOCTURNE TOKENS ==================================================
     Evolves the shipped navy/brass identity — recognizably DreamFinder,
     elevated. Boldness lives in ONE place: the Sleep Signature
     constellation. Everything else stays quiet and disciplined. */
  :root{
    --midnight:#0A1124;
    --nocturne:#141E3C;
    --veil:rgba(233,239,250,.14);
    --veil-soft:rgba(233,239,250,.07);
    --brass:#D4A84B;
    --brass-soft:#E9CE8F;
    --moonlight:#E9EFFA;
    --moon-dim:rgba(233,239,250,.62);
    --linen:#F4EFE6;
    --ink:#1A2036;
    --ink-soft:#5A617A;
    --display:"Didot","Didot LT STD","Bodoni 72",Georgia,"Times New Roman",serif;
    --body:"Avenir Next","Avenir","Helvetica Neue",-apple-system,system-ui,sans-serif;
    --util:"Avenir Next Condensed","Avenir Next","Arial Narrow",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--midnight);color:var(--moonlight);
    font-family:var(--body);font-size:17px;line-height:1.5;
    overflow:hidden;touch-action:manipulation;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
  a{touch-action:manipulation}
  .scene{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
  .scene.on{display:flex}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
  }
  .eyebrow{font-family:var(--util);font-weight:600;font-size:.72rem;
    letter-spacing:.34em;text-transform:uppercase;color:var(--brass)}
  .eyebrow--moon{color:var(--moon-dim)}

  /* ===== CHROME ========================================================== */
  .chrome{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;
    justify-content:space-between;align-items:center;
    padding:calc(14px + env(safe-area-inset-top)) 22px 10px;pointer-events:none}
  .chrome>*{pointer-events:auto}
  .langs{display:flex;gap:2px;border:1px solid var(--veil);border-radius:99px;padding:3px}
  .langs button{font-family:var(--util);font-weight:600;font-size:.72rem;letter-spacing:.18em;
    padding:5px 13px;border-radius:99px;color:var(--moon-dim)}
  .langs button.on{background:var(--brass);color:var(--midnight)}
  .restart{font-family:var(--util);font-weight:600;font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--moon-dim);padding:8px 4px}

  /* ===== AMBIENT STARFIELD =============================================== */
  .sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .sky i{position:absolute;width:2px;height:2px;border-radius:50%;
    background:var(--moonlight);opacity:.16;animation:breathe 6s ease-in-out infinite}
  .sky i:nth-child(3n){animation-delay:2s;width:1.5px;height:1.5px}
  .sky i:nth-child(4n){animation-delay:4s;opacity:.28}
  @keyframes breathe{0%,100%{opacity:.10}50%{opacity:.34}}

  /* ===== WELCOME ========================================================= */
  #welcome{align-items:center;justify-content:center;text-align:center;
    background:
      radial-gradient(120% 90% at 50% 118%, #22315E 0%, rgba(34,49,94,0) 55%),
      radial-gradient(80% 55% at 50% -12%, #1B2A55 0%, rgba(27,42,85,0) 60%),
      var(--midnight)}
  .masthead{font-family:var(--display);font-weight:400;
    font-size:clamp(3.2rem,9vw,6.6rem);line-height:.98;letter-spacing:.01em}
  .masthead em{font-style:italic;color:var(--brass-soft)}
  .welcome-inner{position:relative;z-index:2;display:flex;flex-direction:column;
    align-items:center;gap:1.15rem;padding:0 8vw;max-width:900px}
  .welcome-line{font-size:clamp(1.02rem,2.2vw,1.3rem);color:var(--moon-dim);max-width:34ch}
  .hairline{width:52px;height:1px;background:var(--brass);opacity:.8}
  .cta{font-family:var(--util);font-weight:600;letter-spacing:.26em;text-transform:uppercase;
    font-size:.86rem;color:var(--midnight);background:var(--brass);
    padding:1.05rem 2.6rem;border-radius:99px;margin-top:.4rem;
    box-shadow:0 8px 34px rgba(212,168,75,.35);
    transition:transform .18s ease, opacity .18s ease}
  .cta:active{transform:scale(.97)}
  .cta[disabled]{opacity:.35;pointer-events:none}
  .specialist{font-size:.86rem;color:var(--moon-dim);letter-spacing:.04em}
  .outcome{display:flex;flex-direction:column;align-items:center;gap:.22rem;margin-top:.5rem}
  .outcome .lab{font-family:var(--util);font-weight:600;font-size:.62rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--moon-dim);opacity:.8}
  .outcome .items{font-size:.86rem;color:var(--moon-dim)}
  .outcome .pay{font-size:.82rem;color:var(--moon-dim);opacity:.85;max-width:46ch}
  .demo-tools{display:flex;gap:1.6rem;margin-top:.7rem}
  .demo-fill{font-family:var(--util);font-weight:600;font-size:.7rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--moon-dim);opacity:.7;
    border-bottom:1px solid var(--veil);padding-bottom:2px}
  #welcomeArc{position:absolute;left:0;right:0;bottom:-4vh;height:34vh;opacity:.9}

  /* ===== QUIZ (fully dynamic) =========================================== */
  #quiz{padding:calc(56px + env(safe-area-inset-top)) 6vw 2vh;align-items:center}
  .quiz-frame{width:100%;max-width:860px;display:flex;flex-direction:column;gap:1.5vh;flex:1;min-height:0}
  .q-count{display:flex;align-items:baseline;gap:14px}
  .q-count .n{font-family:var(--display);font-size:2rem;color:var(--brass-soft)}
  .q-headline{font-family:var(--display);font-weight:400;
    font-size:clamp(1.6rem,4vw,2.7rem);line-height:1.12}
  .q-help{color:var(--moon-dim);font-size:.98rem;max-width:56ch}
  .q-body{flex:1;min-height:0;overflow:auto;padding:2px}
  .q-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .q-options.cols-3{grid-template-columns:repeat(3,1fr)}
  .q-opt{text-align:left;background:var(--nocturne);border:1px solid var(--veil-soft);
    border-radius:16px;padding:.95rem 1.15rem;display:flex;flex-direction:column;gap:.15rem;
    transition:border-color .15s ease, background .15s ease}
  .q-opt .l{font-weight:600;font-size:1.02rem}
  .q-opt .s{color:var(--moon-dim);font-size:.84rem}
  .q-opt.sel{border-color:var(--brass);background:#1A2547;box-shadow:0 0 0 1px var(--brass) inset}
  .q-opt.sel .l{color:var(--brass-soft)}
  .multi-note{color:var(--moon-dim);font-size:.85rem;margin-bottom:.6rem}
  /* slider */
  .slider-wrap{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:1.2rem 0}
  .slider-val{font-family:var(--display);font-size:3.4rem;color:var(--brass-soft);line-height:1}
  .slider-feel{font-family:var(--util);font-weight:600;font-size:.8rem;letter-spacing:.26em;
    text-transform:uppercase;color:var(--moon-dim)}
  input[type=range]{width:min(560px,86%);accent-color:var(--brass);height:34px}
  .slider-labels{display:flex;justify-content:space-between;width:min(560px,86%);
    color:var(--moon-dim);font-size:.82rem}
  .q-nav{display:flex;justify-content:space-between;align-items:center;padding-top:.6vh}
  .q-back{font-family:var(--util);font-weight:600;letter-spacing:.2em;font-size:.8rem;
    color:var(--moon-dim);text-transform:uppercase;padding:.9rem 0}
  #quizArcWrap{height:52px;flex:none}
  .journey{display:flex;justify-content:center;flex-wrap:wrap;gap:.7em;
    font-family:var(--util);font-weight:600;font-size:.62rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--moon-dim);opacity:.75;padding:4px 0 0}
  .journey b{color:var(--brass);font-weight:600}
  .journey i{font-style:normal;opacity:.65}

  /* ===== REVEAL ========================================================== */
  #reveal{align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(95% 70% at 50% 42%, #16224A 0%, rgba(22,34,74,0) 62%), var(--midnight)}
  .reveal-inner{position:relative;z-index:2;display:flex;flex-direction:column;
    align-items:center;gap:1rem;padding:0 7vw;width:100%;max-width:880px}
  #constellation{width:min(70vw,520px);height:auto;max-height:26vh}
  #constellation .edge{stroke:var(--brass);stroke-width:1.1;opacity:.85;
    stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s .4s ease forwards}
  #constellation .node{fill:var(--moonlight);opacity:0;animation:nodeIn .4s ease forwards}
  #constellation .node.b{fill:var(--brass-soft)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes nodeIn{to{opacity:1}}
  .reveal-title{font-family:var(--display);font-size:clamp(2rem,5vw,3.3rem);font-weight:400;line-height:1.08}
  .reveal-title em{font-style:italic;color:var(--brass-soft)}
  .profile-chip{display:inline-flex;gap:.6em;align-items:baseline;
    font-family:var(--util);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;
    color:var(--brass);border:1px solid rgba(212,168,75,.4);border-radius:99px;padding:.55rem 1.3rem}
  .priorities{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .prio{display:flex;align-items:center;gap:.55em;background:var(--nocturne);
    border:1px solid var(--veil-soft);border-radius:14px;padding:.75rem 1.1rem;
    font-size:.96rem;font-weight:500}
  .reveal-sub{color:var(--moon-dim);font-size:.94rem;max-width:46ch}

  /* ===== RESULTS ========================================================= */
  #results{padding:calc(64px + env(safe-area-inset-top)) 4vw 2vh;gap:1.2vh}
  .results-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .results-title{font-family:var(--display);font-size:clamp(1.7rem,3.8vw,2.5rem);font-weight:400}
  .results-title em{font-style:italic;color:var(--brass-soft)}
  .sig-stamp{display:flex;align-items:center;gap:10px;color:var(--moon-dim);font-size:.82rem}
  .tiers{display:flex;gap:6px;border:1px solid var(--veil);border-radius:99px;padding:4px;width:max-content}
  .tiers button{font-family:var(--util);font-weight:600;font-size:.78rem;letter-spacing:.2em;
    text-transform:uppercase;padding:.55rem 1.35rem;border-radius:99px;color:var(--moon-dim)}
  .tiers button.on{background:var(--brass);color:var(--midnight)}
  .cards{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr;gap:14px;flex:1;min-height:0}
  .card{background:var(--linen);color:var(--ink);border-radius:22px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;text-align:left;cursor:pointer;
    border:2px solid transparent;transition:border-color .15s ease}
  .card.cmp-sel{border-color:var(--brass)}
  .card.hero{grid-row:1 / span 2}
  .card .ph{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    background:#fff;border-radius:16px;margin:14px 14px 0;padding:4% 6%;position:relative;
    box-shadow:0 10px 28px rgba(26,32,54,.12)}
  .card .ph img{max-width:100%;max-height:100%;object-fit:contain}
  .card .meta{padding:.9rem 1.25rem 2.15rem;display:flex;flex-direction:column;gap:.24rem}
  .card .brand{font-family:var(--util);font-weight:600;font-size:.66rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ink-soft)}
  .card .name{font-family:var(--display);font-size:1.45rem;line-height:1.1}
  .card.hero .name{font-size:clamp(1.6rem,2.8vw,2.2rem)}
  .card .feel{font-size:.88rem;color:var(--ink-soft)}
  .ribbon{position:absolute;top:24px;left:24px;z-index:2;
    font-family:var(--util);font-weight:600;font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;
    background:var(--midnight);color:var(--brass-soft);border-radius:99px;padding:.5rem 1rem}
  .ring{position:absolute;top:22px;right:22px;z-index:2;width:70px;height:70px}
  .ring svg{width:100%;height:100%}
  .ring .track{stroke:rgba(26,32,54,.15);fill:none;stroke-width:5}
  .ring .val{stroke:var(--brass);fill:none;stroke-width:5;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:center}
  .ring text{font-family:var(--util);font-weight:600;font-size:15px;fill:var(--ink)}
  .card .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:.4rem}
  .chip{display:inline-flex;align-items:center;gap:.4em;font-size:.76rem;font-weight:600;
    color:var(--ink);background:rgba(26,32,54,.07);border-radius:99px;padding:.32rem .7rem}
  /* supporting cards run horizontal: plate left, identity right */
  .card.small{flex-direction:row;align-items:stretch}
  .card.small .ph{flex:none;width:44%;margin:14px 0 14px 14px;padding:4%}
  .card.small .meta{flex:1;justify-content:center;padding:1rem 1.1rem 2.05rem}
  .card.small .name{font-size:1.3rem}
  .card.small .ring{width:54px;height:54px;top:18px;right:18px}
  .card.small .ring text{font-size:13px}
  .cmp-tag{position:absolute;bottom:14px;right:16px;z-index:2;
    font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-soft)}
  .card.cmp-sel .cmp-tag{color:var(--brass)}
  .d-btn{position:absolute;bottom:11px;left:16px;z-index:2;
    font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid rgba(26,32,54,.25);padding:2px 0}
  /* first Payment Choices entry — after matches are established, never before */
  .pay-band{display:flex;justify-content:space-between;align-items:center;gap:16px;
    border:1px solid var(--veil-soft);border-radius:16px;padding:.65rem 1.1rem;background:var(--nocturne)}
  .pay-band .tx{display:flex;flex-direction:column;gap:.1rem;min-width:0}
  .pay-band .fit{font-size:.88rem;color:var(--moonlight)}
  .pay-band .lead{font-size:.78rem;color:var(--moon-dim)}
  .btn-quiet{font-family:var(--util);font-weight:600;font-size:.72rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--brass);border:1px solid rgba(212,168,75,.45);
    border-radius:99px;padding:.6rem 1.15rem;white-space:nowrap;flex:none}
  .results-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .results-hint{color:var(--moon-dim);font-size:.86rem}
  .foot-ctas{display:flex;gap:10px;align-items:center}

  /* ===== MATTRESS DETAIL OVERLAY ======================================== */
  #detail{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(10,17,36,.74)}
  #detail.on{display:flex}
  .detail-sheet{width:min(660px,92vw);max-height:88vh;overflow:auto;background:var(--linen);color:var(--ink);
    border-radius:24px;padding:1.35rem 1.5rem;display:flex;flex-direction:column;gap:.65rem;position:relative}
  .detail-sheet .plate{background:#fff;border-radius:16px;padding:4% 8%;display:flex;justify-content:center;
    box-shadow:0 10px 24px rgba(26,32,54,.12)}
  .detail-sheet .plate img{width:70%;max-height:24vh;object-fit:contain}
  .detail-sheet .brand{font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ink-soft)}
  .detail-sheet .name{font-family:var(--display);font-size:1.7rem;line-height:1.05}
  .detail-sheet .feel{color:var(--ink-soft);font-size:.9rem}
  .detail-chips{display:flex;gap:7px;flex-wrap:wrap}
  .detail-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:.2rem}
  .btn-ink{font-family:var(--util);font-weight:600;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--linen);background:var(--ink);border-radius:99px;padding:.65rem 1.3rem}
  .btn-ink.on{background:var(--brass);color:var(--midnight)}
  /* the ONE quiet, consistent link to the canonical Payment Choices layer */
  .detail-pay{border-top:1px solid rgba(26,32,54,.14);padding-top:.8rem;margin-top:.3rem;
    display:flex;flex-direction:column;gap:.3rem}
  .detail-pay .t{font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.26em;
    text-transform:uppercase;color:var(--ink-soft)}
  .detail-pay p{font-size:.86rem;color:var(--ink-soft)}
  .link-quiet{font-size:.88rem;font-weight:600;color:#7D5B34;text-decoration:underline;
    text-underline-offset:3px;text-align:left;padding:2px 0;width:max-content}
  .detail-close{position:absolute;top:12px;right:16px;font-size:1.5rem;color:var(--ink-soft);padding:6px 10px}

  /* ===== COMPARE ========================================================= */
  #compare{padding:calc(64px + env(safe-area-inset-top)) 5vw 2.5vh;gap:1.4vh;align-items:center}
  .cmp-frame{width:100%;max-width:980px;display:flex;flex-direction:column;gap:1.4vh;flex:1;min-height:0}
  .cmp-title{font-family:var(--display);font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:400;text-align:center}
  .cmp-title em{font-style:italic;color:var(--brass-soft)}
  .cmp-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:none}
  .cmp-side{background:var(--linen);color:var(--ink);border-radius:20px;
    padding:.9rem .9rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.28rem;text-align:center}
  .cmp-side .plate{background:#fff;border-radius:14px;padding:3% 6%;width:94%;
    display:flex;justify-content:center;box-shadow:0 8px 20px rgba(26,32,54,.12)}
  .cmp-side img{width:84%;max-height:13vh;object-fit:contain}
  .cmp-side .brand{font-family:var(--util);font-weight:600;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink-soft)}
  .cmp-side .name{font-family:var(--display);font-size:1.25rem;line-height:1.1}
  .fin-btn{font-family:var(--util);font-weight:600;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);border:1px solid rgba(26,32,54,.3);border-radius:99px;padding:.5rem 1.05rem;margin-top:.25rem}
  .fin-btn.on{background:var(--ink);color:var(--brass-soft);border-color:var(--ink)}
  .cmp-rows{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
  .cmp-row{display:grid;grid-template-columns:130px 1fr 1fr;gap:10px}
  .cmp-row .lab{font-family:var(--util);font-weight:600;font-size:.7rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--moon-dim);display:flex;align-items:center}
  .cmp-row .val{background:var(--nocturne);border:1px solid var(--veil-soft);border-radius:12px;
    padding:.7rem 1rem;font-size:.92rem;display:flex;align-items:center}
  .cmp-row .val.same{grid-column:2 / span 2;justify-content:center;color:var(--moon-dim)}
  .cmp-row .val.same b{color:var(--brass-soft);font-weight:600;margin-right:.5em}
  .cmp-foot{display:flex;justify-content:center;gap:14px}
  .cta--ghost{background:none;color:var(--brass);border:1px solid var(--brass);box-shadow:none}

  /* ===== SLEEP PLAN ====================================================== */
  #plan{padding:calc(60px + env(safe-area-inset-top)) 4vw 2vh;align-items:center}
  .plan-frame{width:100%;max-width:1020px;display:flex;flex-direction:column;gap:1vh;flex:1;min-height:0}
  .plan-head{text-align:center;display:flex;flex-direction:column;gap:.15rem;align-items:center}
  .plan-title{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:400}
  .plan-title em{font-style:italic;color:var(--brass-soft)}
  .plan-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:14px;flex:1;min-height:0}
  .plan-final{background:var(--linen);color:var(--ink);border-radius:20px;padding:1rem;
    display:flex;flex-direction:column;gap:.35rem;align-items:center;text-align:center;justify-content:center}
  .plan-final .k{font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--brass);background:var(--midnight);border-radius:99px;padding:.4rem .95rem}
  .plan-final .plate{background:#fff;border-radius:14px;padding:4% 8%;width:88%;
    display:flex;justify-content:center;box-shadow:0 8px 20px rgba(26,32,54,.12)}
  .plan-final img{width:76%;max-height:15vh;object-fit:contain}
  .plan-final .brand{font-family:var(--util);font-weight:600;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink-soft)}
  .plan-final .name{font-family:var(--display);font-size:1.45rem;line-height:1.08}
  .plan-final .feel{color:var(--ink-soft);font-size:.86rem}
  .plan-col{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;padding:2px}
  .plan-block{background:var(--nocturne);border:1px solid var(--veil-soft);border-radius:16px;
    padding:.8rem 1.05rem;display:flex;flex-direction:column;gap:.45rem}
  .plan-block .bt{font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.26em;
    text-transform:uppercase;color:var(--brass)}
  .plan-block .ln{font-size:.9rem}
  .plan-block .dim{color:var(--moon-dim);font-size:.82rem}
  .sys-item{display:flex;align-items:center;justify-content:space-between;gap:.8em}
  .sys-item .nm{font-size:.88rem;min-width:0}
  .sys-item .nm i{font-style:normal;color:var(--moon-dim);font-size:.78rem;display:block}
  .tog{font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid var(--veil);border-radius:99px;padding:.42rem .95rem;color:var(--moon-dim);flex:none}
  .tog.on{border-color:var(--brass);color:var(--brass-soft);background:#1A2547}
  /* equal, reversible payment decision — "Not now" as usable as "Review options" */
  .decide{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .decide button{border:1px solid var(--veil);border-radius:12px;padding:.72rem .4rem;
    font-size:.85rem;font-weight:600;color:var(--moonlight)}
  .decide button.on{border-color:var(--brass);background:#1A2547;color:var(--brass-soft)}
  .plan-foot{display:flex;justify-content:center;gap:14px;padding-top:.2vh}

  /* ===== PAYMENT CHOICES (canonical layer) =============================== */
  #payment{padding:calc(60px + env(safe-area-inset-top)) 5vw 2vh;align-items:center}
  .pay-frame{width:100%;max-width:900px;display:flex;flex-direction:column;gap:.9vh;flex:1;min-height:0}
  .pay-head{display:flex;flex-direction:column;gap:.2rem}
  .pay-title{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:400}
  .pay-fit{color:var(--brass-soft);font-size:.94rem}
  .pay-body{color:var(--moon-dim);font-size:.88rem;max-width:72ch}
  .pay-official{display:flex;flex-direction:column;gap:.1rem;padding:2px 4px}
  .pay-official a{color:var(--brass);font-size:.88rem;text-decoration:underline;
    text-underline-offset:3px;width:max-content}
  .pay-paths{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;padding:2px}
  .path{background:var(--nocturne);border:1px solid var(--veil-soft);border-radius:16px;
    padding:.85rem 1.1rem;display:flex;flex-direction:column;gap:.35rem}
  .path .k{font-family:var(--util);font-weight:600;font-size:.6rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--moon-dim)}
  .path .h{font-family:var(--display);font-size:1.3rem;line-height:1.15}
  .path p{font-size:.86rem;color:var(--moon-dim)}
  .path .links{display:flex;flex-direction:column;gap:.15rem;margin-top:.15rem}
  .path a{color:var(--brass);font-size:.86rem;text-decoration:underline;text-underline-offset:3px;width:max-content}
  .ext-note{font-size:.72rem;color:var(--moon-dim);opacity:.8}
  .path .prow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .path.mx{border-color:rgba(212,168,75,.3)}
  .pay-disc{font-size:.72rem;color:var(--moon-dim);opacity:.85;line-height:1.45}
  .pay-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .pay-consequence{font-size:.78rem;color:var(--moon-dim)}

  /* ===== HANDOFF ========================================================= */
  #handoff{align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 5vw 2.5vh}
  .card-consult{width:100%;max-width:820px;background:var(--linen);color:var(--ink);
    border-radius:26px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .consult-band{background:var(--midnight);color:var(--moonlight);
    padding:1.1rem 1.7rem;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .consult-band .t{font-family:var(--display);font-size:1.35rem}
  .consult-band .t em{font-style:italic;color:var(--brass-soft)}
  .consult-body{display:grid;grid-template-columns:1fr 1.35fr;gap:1.3rem;padding:1.2rem 1.7rem 1.35rem}
  .consult-body .plate{background:#fff;border-radius:16px;padding:7%;
    box-shadow:0 10px 24px rgba(26,32,54,.12);align-self:center}
  .consult-body img{width:100%;object-fit:contain}
  .consult-info{display:flex;flex-direction:column;gap:.45rem;min-width:0}
  .consult-info .brand{font-family:var(--util);font-weight:600;font-size:.64rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ink-soft)}
  .consult-info .name{font-family:var(--display);font-size:1.7rem;line-height:1.05}
  .consult-info .feel{color:var(--ink-soft);font-size:.88rem}
  .consult-list{margin-top:.3rem;display:flex;flex-direction:column;gap:.4rem}
  .consult-list .row{display:flex;gap:.6em;align-items:baseline;font-size:.9rem}
  .consult-list .row b{font-family:var(--util);font-weight:600;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--brass);flex:none;width:92px}
  .consult-list .row span{min-width:0}
  .handoff-note{margin-top:1.1rem;color:var(--moon-dim);font-size:.88rem;text-align:center;max-width:56ch}
  .handoff-foot{margin-top:.85rem}

  /* ===== ISOLATION CHECK ================================================= */
  #iso{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(10,17,36,.82)}
  #iso.on{display:flex}
  .iso-sheet{width:min(760px,94vw);max-height:88vh;overflow:auto;background:var(--nocturne);
    border:1px solid var(--veil);border-radius:20px;padding:1.25rem 1.5rem;
    display:flex;flex-direction:column;gap:.55rem;position:relative}
  .iso-sheet h3{font-family:var(--display);font-weight:400;font-size:1.4rem}
  .iso-sheet .sub{color:var(--moon-dim);font-size:.85rem}
  .iso-row{display:flex;gap:.8em;align-items:baseline;font-size:.88rem}
  .iso-row .st{font-family:var(--util);font-weight:600;letter-spacing:.18em;font-size:.68rem;flex:none;width:44px}
  .iso-row .st.ok{color:#7FD49B}
  .iso-row .st.bad{color:#E58B8B}
  .iso-close{position:absolute;top:10px;right:14px;font-size:1.4rem;color:var(--moon-dim);padding:6px 10px}

  /* loading veil */
  #boot{position:fixed;inset:0;z-index:90;background:var(--midnight);display:flex;
    align-items:center;justify-content:center;color:var(--moon-dim);
    font-family:var(--util);letter-spacing:.3em;text-transform:uppercase;font-size:.75rem}
  #boot.off{display:none}

  /* ===== ORIENTATION ==================================================== */
  @media (orientation:portrait){
    .cards{grid-template-columns:1fr;grid-template-rows:1.4fr .55fr .55fr}
    .card.hero{grid-row:1;grid-column:1}
    .q-options{grid-template-columns:1fr 1fr}
    .consult-body{grid-template-columns:1fr}
    .cmp-row{grid-template-columns:96px 1fr 1fr}
    .masthead{font-size:clamp(3rem,13vw,5.4rem)}
    .card.small .ph{width:34%}
    .plan-grid{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .plan-final{flex-direction:row;text-align:left;justify-content:flex-start;gap:1rem}
    .plan-final .plate{width:34%;flex:none}
    .plan-final img{max-height:11vh}
    .plan-final .fin-id{display:flex;flex-direction:column;gap:.3rem;align-items:flex-start}
    .pay-band{flex-direction:column;align-items:flex-start;gap:.5rem}
  }
  @media (max-width:560px){
    .q-options,.q-options.cols-3{grid-template-columns:1fr}
    .cmp-stage{grid-template-columns:1fr}
    .decide{grid-template-columns:1fr}
  }
</style>
</head>

<div id="boot">Preparing the fitting…</div>

<div class="chrome">
  <div class="langs" role="group" aria-label="Language">

    <button id="langEs" onclick="setLang('es')">ES</button>
  </div>
  <button class="restart" id="restartBtn" onclick="startOver()"></button>
</div>

<!-- WELCOME -->
<section class="scene on" id="welcome">
  <div class="sky" id="skyWelcome"></div>
  <svg id="welcomeArc" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <div class="welcome-inner">
    <div class="eyebrow" data-t="wEyebrow"></div>
    <h1 class="masthead">Dream<em>Finder</em></h1>
    <div class="hairline"></div>
    <p class="welcome-line" data-t="wLine"></p>
    <button class="cta" onclick="startQuiz()" data-t="wCta"></button>
    <p class="specialist" data-t="wSpecialist"></p>
    <!-- neutral expectation: payment options exist for the FINAL Sleep Plan;
         subordinate to Start, sourced from governed config copy -->
    <div class="outcome">
      <div class="lab" id="wOutcomeLab"></div>
      <div class="items" id="wOutcomeItems"></div>
      <div class="pay" id="wPayLine"></div>
    </div>
    <div class="demo-tools">
      <button class="demo-fill" onclick="demoFill()" data-t="wDemo"></button>
      <button class="demo-fill" onclick="runIso()" data-t="wIso"></button>
    </div>
  </div>
</section>

<!-- QUIZ -->
<section class="scene" id="quiz">
  <div class="quiz-frame">
    <div class="q-count"><span class="n" id="qNum"></span><span class="eyebrow eyebrow--moon" id="qOf"></span></div>
    <h2 class="q-headline" id="qHeadline"></h2>
    <p class="q-help" id="qHelp"></p>
    <div class="q-body" id="qBody"></div>
    <div class="q-nav">
      <button class="q-back" id="qBack" onclick="prevQ()"></button>
      <button class="cta" id="qNext" onclick="nextQ()"></button>
    </div>
    <div id="quizArcWrap"><svg id="quizArc" viewBox="0 0 1000 90" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%" aria-hidden="true"></svg></div>

    <div class="journey" id="journeyStrip"></div>
  </div>
</section>

<!-- REVEAL -->
<section class="scene" id="reveal">
  <div class="sky" id="skyReveal"></div>
  <div class="reveal-inner">
    <svg id="constellation" viewBox="0 0 560 300" aria-hidden="true"></svg>
    <div class="eyebrow" data-t="rEyebrow"></div>
    <h2 class="reveal-title" data-t-html="rTitle"></h2>
    <div class="profile-chip" id="profileChip"></div>
    <div class="priorities" id="prioList"></div>
    <p class="reveal-sub" data-t="rSub"></p>
    <button class="cta" onclick="go('results')" data-t="rCta"></button>
  </div>
</section>

<!-- RESULTS -->
<section class="scene" id="results">
  <div class="results-head">
    <div>
      <div class="eyebrow" data-t="resEyebrow"></div>
      <h2 class="results-title" data-t-html="resTitle"></h2>

    <div class="sig-stamp"><svg id="stampResults" width="64" height="36" viewBox="0 0 64 36" aria-hidden="true"></svg><span id="stampName"></span></div>
  </div>

  <div class="cards" id="cardGrid"></div>
  <div class="pay-band" id="payBand"></div>
  <div class="results-foot">
    <span class="results-hint" data-t="resHint"></span>
    <div class="foot-ctas">
      <button class="cta cta--ghost" id="planCta" onclick="go('plan')" disabled data-t="resPlanCta"></button>
      <button class="cta" id="cmpCta" onclick="go('compare')" disabled data-t="resCta"></button>
    </div>
  </div>
</section>

<!-- MATTRESS DETAIL OVERLAY -->
<div id="detail" onclick="if(event.target===this)closeDetail()">
  <div class="detail-sheet">
    <button class="detail-close" onclick="closeDetail()" aria-label="Close">×</button>
    <div class="plate"><img id="dImg" alt=""></div>
    <div class="brand" id="dBrand"></div>
    <div class="name" id="dName"></div>
    <div class="feel" id="dFeel"></div>
    <div class="detail-chips" id="dChips"></div>

      <button class="btn-ink" id="dFinBtn"></button>
    </div>
    <div class="detail-pay">
      <div class="t" id="dPayT"></div>
      <p id="dPayBody"></p>
      <button class="link-quiet" id="dPayLink" onclick="openPay(sceneNow())"></button>
    </div>
  </div>
</div>

<!-- COMPARE -->
<section class="scene" id="compare">
  <div class="cmp-frame">
    <h2 class="cmp-title" data-t-html="cmpTitle"></h2>
    <div class="cmp-stage" id="cmpStage"></div>
    <div class="cmp-rows" id="cmpRows"></div>
    <div class="cmp-foot">
      <button class="cta cta--ghost" onclick="go('results')" data-t="cmpBack"></button>
      <button class="cta" id="cmpPlanCta" onclick="go('plan')" disabled data-t="cmpCta"></button>
    </div>
  </div>
</section>

<!-- SLEEP PLAN -->
<section class="scene" id="plan">
  <div class="plan-frame">
    <div class="plan-head">
      <div class="eyebrow" data-t="planEyebrow"></div>
      <h2 class="plan-title" data-t-html="planTitle"></h2>
    </div>
    <div class="plan-grid">
      <div class="plan-final" id="planFinal"></div>
      <div class="plan-col" id="planCol"></div>
    </div>
    <div class="plan-foot">
      <button class="cta cta--ghost" onclick="go('results')" data-t="planBack"></button>
      <button class="cta" onclick="go('handoff')" data-t="planCta"></button>
    </div>
  </div>
</section>

<!-- PAYMENT CHOICES — the canonical, governed layer -->
<section class="scene" id="payment">
  <div class="pay-frame">
    <div class="pay-head">
      <div class="eyebrow" id="payEyebrow"></div>
      <h2 class="pay-title" id="payTitle"></h2>
      <p class="pay-fit" id="payFit"></p>
      <p class="pay-body" id="payBody"></p>
    </div>
    <div class="pay-paths" id="payPaths"></div>
    <div class="pay-official" id="payOfficial"></div>
    <p class="pay-disc" id="payDisc"></p>

      <span class="pay-consequence" id="payConsequence"></span>

<!-- HANDOFF -->
<section class="scene" id="handoff">
  <div class="sky" id="skyHandoff"></div>

    <div class="consult-band">
      <div class="t" id="hTitle"></div>

      <div class="plate"><img id="hImg" alt=""></div>

        <div class="name" id="hName"></div>
        <div class="feel" id="hFeel"></div>
        <div class="consult-list" id="hRows"></div>
      </div>
    </div>

  <p class="handoff-note" data-t="hNote"></p>
  <div class="handoff-foot"><button class="cta cta--ghost" onclick="startOver()" data-t="hAgain"></button></div>
</section>

<!-- ISOLATION CHECK REPORT -->
<div id="iso" onclick="if(event.target===this)closeIso()">

    <button class="iso-close" onclick="closeIso()" aria-label="Close">×</button>
    <h3 data-t="isoTitle"></h3>
    <p class="sub" data-t="isoSub"></p>
    <div id="isoRows"></div>
  </div>
</div>

   (the repo's own test-harness technique). The Payment Choices layer is a

   payment state never enters scoring.
============================================================================= */

var lang = "en", answers = {}, qPos = 0, visible = [];

/* payment-side state — deliberately never passed to the engine */

/* ---- constellation: derived from the REAL answers ---- */
function answerSeedFor(ans){
  var vis = QUESTIONS.filter(function(q){
    return !q.skipIf || ans[q.skipIf.question] !== q.skipIf.answer;
  });
  var seed = [];
  vis.forEach(function(q){
    var v = ans[q.id], n = 2;
    if (q.type === "slider"){ n = Math.round(((v||q.defaultValue) - q.min) / (q.max - q.min) * 4); }
    else if (q.type === "multiple"){ n = Math.min(4, (v||[]).length + 1); }
    else { n = Math.max(0, (q.options||[]).findIndex(function(o){ return o.id === v; })); }
    seed.push(Math.max(0, Math.min(4, n)));
  });
  while (seed.length < 10) seed.push(2);
  return seed.slice(0, 10);
}
function answerSeed(){ return answerSeedFor(answers); }
function starPoints(w, h, pad){
  var seed = answerSeed(), pts = [];
  for (var i = 0; i < 10; i++){
    var x = pad + (w - 2*pad) * (i/9);
    var arcY = h*0.62 - Math.sin(Math.PI*(i/9)) * h*0.34;
    pts.push([x, arcY + (seed[i] - 2.2) * (h*0.09)]);
  }

}
function drawConstellation(svgId, w, h, animate){
  var svg = document.getElementById(svgId); if (!svg) return;
  var pts = starPoints(w, h, 26), s = "";
  var path = "M" + pts.map(function(p){ return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L ");
  s += '<path class="edge" d="' + path + '" fill="none"'
    + (animate ? '' : ' style="stroke-dasharray:none;stroke-dashoffset:0;animation:none;stroke:#D4A84B;opacity:.85"') + '/>';
  pts.forEach(function(p, i){
    var b = [0,4,9].indexOf(i) >= 0;
    s += '<circle class="node' + (b ? ' b' : '') + '" cx="' + p[0] + '" cy="' + p[1] + '" r="' + (b ? 4 : 2.4) + '"'
      + (animate ? ' style="animation-delay:' + (0.15 + i*0.14) + 's"' : ' style="opacity:1;animation:none"') + '/>';
  });

    + '" fill="none" stroke="rgba(233,239,250,.14)" stroke-width="1"/>';
  pts.forEach(function(p, i){
    var on = i < lit;
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (on ? 3.4 : 2) + '" fill="'

  });
  svg.innerHTML = s;
}

   · evergreen paths (lease-to-own, credit-builder): claim-safe detail

   · Mexico scenario: selected by presentationScenario only, fixed last,

  document.getElementById("payOfficial").innerHTML = off;
  document.getElementById("payDisc").textContent = L(m.disclosure);
  document.getElementById("payConsequence").textContent = L(m.consequence);
  document.getElementById("payBackBtn").textContent = L(T.payBackLbl);
}
function togAgenda(id){
  finAgenda[id] = !finAgenda[id];
  if (!finAgenda[id]) delete finAgenda[id];
  renderPayment();
}

/* ---- scenes ---- */
var SCENES = ["welcome","quiz","reveal","results","compare","plan","payment","handoff"];
function go(name){
  SCENES.forEach(function(s){ document.getElementById(s).classList.toggle("on", s === name); });
  if (name === "results") renderResults();
  if (name === "compare") renderCompare();
  if (name === "plan") renderPlan();
  if (name === "payment") renderPayment();
  if (name === "handoff") renderHandoff();
}
function sceneNow(){
  for (var i = 0; i < SCENES.length; i++) if (document.getElementById(SCENES[i]).classList.contains("on")) return SCENES[i];
  return "welcome";
}
function setLang(l){
  lang = l;
  document.getElementById("langEn").classList.toggle("on", l === "en");
  document.getElementById("langEs").classList.toggle("on", l === "es");
  if (computed) compute();   // re-run the real engine so language-resolved output stays honest
  render();
}
function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = L(T[el.getAttribute("data-t")]); });
  document.querySelectorAll("[data-t-html]").forEach(function(el){ el.innerHTML = L(T[el.getAttribute("data-t-html")]); });
  document.getElementById("restartBtn").textContent = L(T.restart);
  renderWelcomeConfigLines();
  var scene = sceneNow();
  if (scene === "quiz") renderQ();
  if (scene === "reveal"){ drawConstellation("constellation", 560, 300, false); renderReveal(); }
  if (scene === "results") renderResults();
  if (scene === "compare") renderCompare();
  if (scene === "plan") renderPlan();
  if (scene === "payment") renderPayment();
  if (scene === "handoff") renderHandoff();
  if (document.getElementById("detail").classList.contains("on") && detailId) openDetail(detailId);
  drawArc("welcomeArc", 1000, 300, 0);
}
function renderWelcomeConfigLines(){
  /* governed copy: the journey the consultation builds (voice.outcome*) and
     the neutral payment expectation (financing.copy.welcomeSupport) */
  if (!SC) return;
  var v = (lang === "es" && SC.voice_es) ? SC.voice_es : (SC.voice || {});
  document.getElementById("wOutcomeLab").textContent = v.outcomeLabel || "";
  document.getElementById("wOutcomeItems").textContent = v.outcomeItems || "";
  document.getElementById("wPayLine").textContent = FIN ? L(FIN.copy.welcomeSupport) : "";
}

function renderReveal(){
  if (!computed) return;
  document.getElementById("profileChip").innerHTML =
    star(11, "#D4A84B") + "&nbsp; " + computed.profileName + " &nbsp;·&nbsp; " + L(computed.subtitle);
  var s = "";
  computed.trialFocus.forEach(function(p){ s += '<div class="prio">' + star(12, "#E9CE8F") + L(p) + '</div>'; });
  document.getElementById("prioList").innerHTML = s;
}

function cardHtml(entry, hero){
  var m = model(entry.id); if (!m) return "";
  var sel = cmpSel.indexOf(entry.id) >= 0;
  var chips = "";
  if (hero && computed){
    computed.trialFocus.forEach(function(p){ chips += '<span class="chip">' + star(10, "#D4A84B") + L(p) + '</span>'; });
  }
  return '<div class="card ' + (hero ? "hero" : "small") + (sel ? " cmp-sel" : "") + '" role="button" tabindex="0" onclick="toggleCmp(\'' + entry.id + '\')">'
    + (hero ? '<div class="ribbon">' + L(T.bestMatch) + '</div>' : '')
    + '<div class="ring">' + ringSvg(entry.pct) + '</div>'
    + '<div class="ph"><img src="' + imgOf(m) + '" alt="' + m.name + '"></div>'
    + '<div class="meta">'
    +   '<div class="brand">' + m.brand + (m.subBrand ? ' · ' + m.subBrand : '') + '</div>'
    +   '<div class="name">' + m.name + '</div>'
    +   '<div class="feel">' + L(T.feelLbl) + ': ' + feelOf(m) + '</div>'
    +   (chips ? '<div class="chips">' + chips + '</div>' : '')
    + '</div>'
    + '<button class="d-btn" onclick="event.stopPropagation();openDetail(\'' + entry.id + '\')">' + L(T.detailsBtn) + '</button>'
    + '<span class="cmp-tag">' + (sel ? L(T.comparedTag) : L(T.compareTag)) + '</span>'
    + '</div>';
}
function renderResults(){
  if (!computed) return;
  var tiers = [["gold","tierGold"],["silver","tierSilver"],["bronze","tierBronze"]], tt = "";
  tiers.forEach(function(t){
    tt += '<button class="' + (activeTier === t[0] ? "on" : "") + '" onclick="activeTier=\'' + t[0] + '\';renderResults()">' + L(T[t[1]]) + '</button>';
  });
  document.getElementById("tierTabs").innerHTML = tt;
  var list = computed.tiers[activeTier] || [], s = "";
  list.forEach(function(e, i){ s += cardHtml(e, i === 0); });
  document.getElementById("cardGrid").innerHTML = s;
  document.getElementById("stampName").textContent = computed.profileName;
  drawConstellation("stampResults", 64, 36, false);
  document.getElementById("cmpCta").disabled = cmpSel.length !== 2;
  document.getElementById("planCta").disabled = !finalistId;
  /* the first Payment Choices entry — established AFTER the matches, and
     explicit that fit decided the shortlist and payment cannot move it */
  if (FIN){
    document.getElementById("payBand").innerHTML =
      '<div class="tx"><span class="fit">' + L(FIN.copy.fitFirst) + '</span>'
      + '<span class="lead">' + L(FIN.copy.resultsLead) + '</span></div>'
      + '<button class="btn-quiet" onclick="openPay(\'results\')">' + L(FIN.copy.cta) + '</button>';
  }
}
function toggleCmp(id){
  var i = cmpSel.indexOf(id);
  if (i >= 0) cmpSel.splice(i, 1);
  else { if (cmpSel.length >= 2) cmpSel.shift(); cmpSel.push(id); }
  renderResults();
}

/* ---- mattress detail overlay ---- */
var detailId = null;
function openDetail(id){
  detailId = id;
  var m = model(id); if (!m) return;
  document.getElementById("dImg").src = imgOf(m);
  document.getElementById("dBrand").textContent = m.brand + (m.subBrand ? " · " + m.subBrand : "");
  document.getElementById("dName").textContent = m.name;
  document.getElementById("dFeel").textContent = L(T.feelLbl) + ": " + feelOf(m) + " · " + L(T.matchLbl) + " " + pctOf(id) + "%";
  var chips = "";
  (computed ? computed.trialFocus : []).forEach(function(p){
    chips += '<span class="chip">' + star(10, "#D4A84B") + L(p) + '</span>';
  });
  document.getElementById("dChips").innerHTML = chips;
  var fb = document.getElementById("dFinBtn");
  fb.textContent = finalistId === id ? L(T.isFinalist) : L(T.makeFinalist);
  fb.className = "btn-ink" + (finalistId === id ? " on" : "");
  fb.onclick = function(){ finalistId = (finalistId === id) ? null : id; openDetail(id); renderResults(); };
  /* the one quiet, consistent link to the canonical Payment Choices layer */
  if (FIN){
    document.getElementById("dPayT").textContent = L(FIN.copy.drawerTitle);
    document.getElementById("dPayBody").textContent = L(FIN.copy.drawerBody);
    document.getElementById("dPayLink").textContent = L(FIN.copy.drawerMark) + " →";
  }
  document.getElementById("detail").classList.add("on");
}
function closeDetail(){ detailId = null; document.getElementById("detail").classList.remove("on"); }

function tierOf(id){
  for (var t in computed.tiers) if (computed.tiers[t].some(function(e){ return e.id === id; })) return t;
  return "";
}
function pctOf(id){
  if (!computed) return "";
  for (var t in computed.tiers){ var e = computed.tiers[t].find(function(x){ return x.id === id; }); if (e) return e.pct; }
  return "";
}
function chooseFinalist(id){
  finalistId = (finalistId === id) ? null : id;
  renderCompare();
}
function renderCompare(){
  if (cmpSel.length !== 2){ go("results"); return; }
  var a = model(cmpSel[0]), b = model(cmpSel[1]);
  var stage = "";
  [a, b].forEach(function(m){
    stage += '<div class="cmp-side"><div class="plate"><img src="' + imgOf(m) + '" alt="' + m.name + '"></div>'
      + '<div class="brand">' + m.brand + (m.subBrand ? ' · ' + m.subBrand : '') + '</div>'
      + '<div class="name">' + m.name + '</div>'
      + '<button class="fin-btn' + (finalistId === m.id ? ' on' : '') + '" onclick="chooseFinalist(\'' + m.id + '\')">'
      + (finalistId === m.id ? L(T.isFinalist) : L(T.makeFinalist)) + '</button>'
      + '</div>';
  });
  document.getElementById("cmpStage").innerHTML = stage;
  function row(lab, va, vb){
    if (va === vb) return '<div class="cmp-row"><div class="lab">' + lab + '</div><div class="val same"><b>' + va + '</b>· ' + L(T.sameTag) + '</div></div>';
    return '<div class="cmp-row"><div class="lab">' + lab + '</div><div class="val">' + va + '</div><div class="val">' + vb + '</div></div>';
  }
  var tn = {gold:T.tierGold, silver:T.tierSilver, bronze:T.tierBronze};
  var rows = "";
  rows += row(L(T.feelLbl), feelOf(a), feelOf(b));
  rows += row(L(T.matchLbl), pctOf(a.id) + "%", pctOf(b.id) + "%");
  rows += row(L(T.tierLbl), L(tn[tierOf(a.id)] || {en:tierOf(a.id)}), L(tn[tierOf(b.id)] || {en:tierOf(b.id)}));
  if (computed.trialFocus.length){
    rows += row(L(T.testLbl), L(computed.trialFocus[0]), L(computed.trialFocus[computed.trialFocus.length > 1 ? 1 : 0]));
  }
  document.getElementById("cmpRows").innerHTML = rows;
  document.getElementById("cmpPlanCta").disabled = !finalistId;
}

/* ---- Sleep Plan: trial priorities + compared + finalist + optional Sleep
        System + the Payment Choices decision (equal, reversible) ---- */
function toggleSys(id){
  var i = sysSel.indexOf(id);
  if (i >= 0) sysSel.splice(i, 1); else sysSel.push(id);
  renderPlan();
}
function decide(choice){
  payCleared = (payDecision === choice);
  payDecision = (payDecision === choice) ? null : choice;
  if (choice === "review" && payDecision === "review"){ renderPlan(); openPay("plan"); return; }
  renderPlan();
}
function renderPlan(){
  if (!computed) { go("results"); return; }
  var fid = finalistId || computed.topPickId;
  var m = model(fid); if (!m) return;
  var f = '<div class="k">' + L(T.finalist) + (finalistId ? '' : ' · ' + L(T.bestMatch)) + '</div>'
    + '<div class="plate"><img src="' + imgOf(m) + '" alt="' + m.name + '"></div>'
    + '<div class="fin-id"><div class="brand">' + m.brand + (m.subBrand ? ' · ' + m.subBrand : '') + '</div>'
    + '<div class="name">' + m.name + '</div>'
    + '<div class="feel">' + L(T.feelLbl) + ': ' + feelOf(m) + ' · ' + L(T.matchLbl) + ' ' + pctOf(fid) + '%</div></div>';
  document.getElementById("planFinal").innerHTML = f;

  var s = "";
  /* trial priorities */
  s += '<div class="plan-block"><div class="bt">' + L(T.testLbl) + '</div>';
  computed.trialFocus.forEach(function(p){ s += '<div class="ln">' + star(11, "#E9CE8F") + ' ' + L(p) + '</div>'; });
  s += '</div>';
  /* compared */
  s += '<div class="plan-block"><div class="bt">' + L(T.comparedLbl) + '</div>';
  if (cmpSel.length){
    s += '<div class="ln">' + cmpSel.map(function(id){ var mm = model(id); return mm ? mm.name : id; }).join('  ·  ') + '</div>';
  } else {
    s += '<div class="dim">—</div>';
  }
  s += '</div>';
  /* optional Sleep System — the real production accessory ranking */
  s += '<div class="plan-block"><div class="bt">' + L(T.systemLbl) + '</div>';
  if (accRunner && ACC.length){
    var ranked = accRunner(ACC, answers, lang);
    var picks = ranked.filter(function(a){ return a.matched; }).slice(0, 3);
    if (picks.length < 2) picks = ranked.slice(0, 3);
    picks.forEach(function(a){
      var on = sysSel.indexOf(a.id) >= 0;
      s += '<div class="sys-item"><span class="nm">' + L(a.name)
        + '<i>' + (a.reasons && a.reasons.length ? a.reasons[0] : "") + '</i></span>'
        + '<button class="tog' + (on ? ' on' : '') + '" onclick="toggleSys(\'' + a.id + '\')">'
        + (on ? L(T.addedSys) : L(T.addSys)) + '</button></div>';
    });
    if (FIN) s += '<div class="dim">' + L(FIN.copy.sleepSystemGuidance) + '</div>';
  }
  s += '</div>';
  /* the Payment Choices decision — equal, reversible; "Not now" is as
     usable as "Review options" */
  if (FIN){
    s += '<div class="plan-block"><div class="bt">' + L(FIN.copy.eyebrow) + '</div>'
      + '<div class="dim">' + L(FIN.copy.fitFirst) + '</div>'
      + '<div class="decide">'
      + '<button class="' + (payDecision === "review" ? "on" : "") + '" onclick="decide(\'review\')">' + L(FIN.copy.resultsAsk) + '</button>'
      + '<button class="' + (payDecision === "not_now" ? "on" : "") + '" onclick="decide(\'not_now\')">' + L(FIN.copy.agendaNotNow) + '</button>'
      + '<button class="' + (payDecision === "undecided" ? "on" : "") + '" onclick="decide(\'undecided\')">' + L(T.decideUndecided) + '</button>'
      + '</div>';
    if (payDecision === "not_now") s += '<div class="dim">' + L(FIN.copy.interestNotNowAnnounce) + '</div>';
    else if (payDecision === null && payCleared) s += '<div class="dim">' + L(FIN.copy.interestClearedAnnounce) + '</div>';
    s += '</div>';
  }
  document.getElementById("planCol").innerHTML = s;
}

function payDecisionLabel(){
  if (payDecision === "review"){
    var m = paymentModel();
    var names = Object.keys(finAgenda).map(function(id){
      var c = m ? m.cards.find(function(x){ return x.id === id; }) : null;
      return c ? c.title : id;
    });
    return L(FIN.copy.resultsAsk) + (names.length ? " — " + names.join(", ") : " — " + L(FIN.copy.agendaEmpty));
  }
  if (payDecision === "not_now") return L(FIN.copy.agendaNotNow) + " — " + L(FIN.copy.agendaDismissed);
  if (payDecision === "undecided") return L(T.decideUndecided);
  return L(T.decideNone);
}
function renderHandoff(){
  if (!computed) return;
  var fid = finalistId || computed.topPickId;
  var m = model(fid); if (!m) return;
  /* governed handoff headline: "Your Sleep Plan. Your Payment Choices." */
  document.getElementById("hTitle").textContent =
    FIN ? L(FIN.copy.handoffHeadline) : "Consultation card";
  document.getElementById("hImg").src = imgOf(m);
  document.getElementById("hBrand").textContent = m.brand + (m.subBrand ? " · " + m.subBrand : "");
  document.getElementById("hName").textContent = m.name;
  document.getElementById("hFeel").textContent = L(T.feelLbl) + ": " + feelOf(m) + " · " + L(T.matchLbl) + " " + pctOf(fid) + "%";
  var rows = "";
  rows += '<div class="row"><b>' + L(T.profileLbl) + '</b><span>' + computed.profileName + ' · ' + L(computed.subtitle) + '</span></div>';
  computed.trialFocus.forEach(function(p, i){
    rows += '<div class="row"><b>' + (i === 0 ? L(T.testLbl) : "") + '</b><span>' + L(p) + '</span></div>';
  });
  rows += '<div class="row"><b>' + L(T.comparedLbl) + '</b><span>'
    + (cmpSel.length ? cmpSel.map(function(id){ var mm = model(id); return mm ? mm.name : id; }).join(" · ") : "—")
    + '</span></div>';
  rows += '<div class="row"><b>' + L(T.systemLbl) + '</b><span>'
    + (sysSel.length ? sysSel.map(function(id){ var a = ACC.find(function(x){ return x.id === id; }); return a ? L(a.name) : id; }).join(" · ") : "—")
    + '</span></div>';
  if (FIN){
    rows += '<div class="row"><b>' + L(T.paymentLbl) + '</b><span>' + payDecisionLabel() + '</span></div>';
  }
  document.getElementById("hRows").innerHTML = rows;
  drawConstellation("stampHandoff", 64, 36, false);
}

/* =============================================================================
   STATE ISOLATION — LIVE CHECK
   Direction 1: payment state (decision, agenda, Sleep System picks) must not
   change scores, order, default tier, top pick emphasis, Sleep Signature,
   Sleep Brief priorities, or the finalist.
   Direction 2: quiz answers must not change payment program availability,
   order, language, Mexico-path visibility, or official destinations.
============================================================================= */
function sleepFingerprint(ans, lg){
  var out = engine(JSON.parse(JSON.stringify(ans)), lg);
  var brief = briefRunner(ans, lg);
  return JSON.stringify({
    scores: out.scores, tiers: out.tiers,
    topPick: out.tiers.gold.length ? out.tiers.gold[0].id : null,
    defaultTier: "gold",
    heroEmphasis: out.tiers.gold.length ? out.tiers.gold[0].id : null,
    focus: brief.trialFocus, profile: brief.profileName,
    signature: answerSeedFor(ans)
  });
}
function payFingerprint(){
  var m = paymentModel(); if (!m) return "none";
  return JSON.stringify({
    order: m.cards.map(function(c){ return c.id; }),
    mexicoLast: m.cards.length && !!m.cards[m.cards.length - 1].mexico,
    exactShown: m.cards.map(function(c){ return !!(c.offers && c.offers.length); }),
    strings: m.cards.map(function(c){
      return [c.title, c.detail, c.example, c.disclosure, c.staleBody, c.prequal]
        .map(function(x){ return x ? JSON.stringify(x) : ""; }).join("|");
    }),
    destinations: m.cards.map(function(c){ return c.link ? c.link.url : ""; })
      .concat([m.official ? m.official.url : ""])
  });
}
function runIso(){
  if (!engine || !briefRunner || !FIN || !finKit) return;
  var ansA = { sleep_quality:"fair", trigger:"worn_out", mattress_size:"queen",
    partner_sleep:"partner", partner_disturbance:"sometimes", sleep_position:"side",
    body_type:"average", temperature:"cold", firmness:3,
    sleep_issues:["hip_pain","sagging"], health_conditions:["reflux"] };
  var ansB = JSON.parse(JSON.stringify(ansA));
  ansB.sleep_position = "back"; ansB.temperature = "hot"; ansB.firmness = 8;
  ansB.sleep_issues = ["back_pain"]; ansB.health_conditions = ["snoring"];

  var checks = [];
  function check(name, pass, note){ checks.push({ name: name, pass: pass, note: note || "" }); }

  /* Direction 1 — vary payment state, sleep outputs must be identical */
  var saved = { d: payDecision, a: JSON.parse(JSON.stringify(finAgenda)),
                s: sysSel.slice(), f: finalistId };
  var base = sleepFingerprint(ansA, lang);
  var all = true;
  [null, "review", "not_now", "undecided"].forEach(function(d){
    payDecision = d;
    if (sleepFingerprint(ansA, lang) !== base) all = false;
  });
  finAgenda = { "promotional:Synchrony": true, "plan:lacks-in-house": true, "scenario:mexico-delivery": true };
  if (sleepFingerprint(ansA, lang) !== base) all = false;
  sysSel = ACC.slice(0, 3).map(function(a){ return a.id; });
  if (sleepFingerprint(ansA, lang) !== base) all = false;
  check({en:"Payment state cannot move scores, order, default tier, top-pick emphasis, Sleep Signature, or Sleep Brief",
         es:"El estado de pago no puede mover puntajes, orden, nivel, énfasis, Firma de Sueño ni Resumen de Sueño"}, all,
        {en:"engine inputs are (answers, language) only — verified by 6 live re-runs",
         es:"las entradas del motor son solo (respuestas, idioma) — verificado con 6 ejecuciones en vivo"});
  var finalistUntouched = finalistId === saved.f;
  payDecision = saved.d; finAgenda = saved.a; sysSel = saved.s; finalistId = saved.f;
  check({en:"Saved finalist is untouched by payment-state changes",
         es:"El finalista guardado no cambia con el estado de pago"}, finalistUntouched);

  /* Direction 2 — vary quiz answers, payment layer must be identical */
  var savedAns = answers;
  answers = ansA; var p1 = payFingerprint();
  answers = ansB; var p2 = payFingerprint();
  answers = savedAns;
  check({en:"Quiz answers cannot change program availability, order, or financing language",
         es:"Las respuestas no pueden cambiar disponibilidad, orden ni el lenguaje de financiamiento"}, p1 === p2,
        {en:"paymentModel() reads store-config.financing only — two contrasting answer sets, identical output",
         es:"paymentModel() lee solo store-config.financing — dos perfiles distintos, salida idéntica"});
  var mObj = paymentModel();
  check({en:"Mexico path visible to everyone and fixed last",
         es:"La opción México es visible para todos y siempre al final"},
        !!(mObj && mObj.cards.length && mObj.cards[mObj.cards.length - 1].mexico));

  /* language must restyle, never re-route */
  var l0 = lang;
  lang = "en"; var pe = JSON.parse(payFingerprint());
  lang = "es"; var ps = JSON.parse(payFingerprint());
  lang = l0;
  var structuralSame = JSON.stringify(pe.order) === JSON.stringify(ps.order)
    && JSON.stringify(pe.destinations) === JSON.stringify(ps.destinations)
    && JSON.stringify(pe.suppressed) === JSON.stringify(ps.suppressed)
    && pe.mexicoLast === ps.mexicoLast;
  check({en:"Language changes copy only — no language-based routing of programs or destinations",
         es:"El idioma cambia solo el texto — sin enrutar programas ni destinos por idioma"}, structuralSame);

  /* governance floor, decided by PRODUCTION'S OWN extracted gating code:
     when financingTermsFresh() is false, every promotional card must carry
     the staleNotice instead of offers, and the freshness-gated installment
     and Mexico details must be replaced by the staleNotice too */
  var pFresh = finKit.termsFresh();
  var promoCards = mObj ? mObj.cards.filter(function(c){ return c.id.indexOf("promotional:") === 0; }) : [];
  var exactSuppressedOk = promoCards.length > 0 && promoCards.every(function(c){
    return pFresh ? true : (!c.offers && !!c.staleBody);
  });
  if (!pFresh && mObj){
    var stale = FC("staleNotice");
    mObj.cards.forEach(function(c){
      if (c.id === "plan:lacks-in-house" && c.detail !== stale) exactSuppressedOk = false;
      if (c.mexico && (c.detail !== stale || c.example)) exactSuppressedOk = false;
    });
  }
  check({en:"Exact rate/term claims render only when production's own financingTermsFresh() allows them (fail-closed today)",
         es:"Las tasas y plazos exactos solo aparecen cuando financingTermsFresh() de producción lo permite (cerrado hoy)"},
        exactSuppressedOk);
  var noCalc = (FIN.plans || []).every(function(p){ return p.paymentCalculationEnabled !== true; });
  check({en:"No plan enables payment calculation — no monthly-payment estimate can exist (V1 invariant)",
         es:"Ningún plan permite calcular pagos — no puede existir un estimado mensual (invariante V1)"}, noCalc);

  var s = "";
  checks.forEach(function(c){
    s += '<div class="iso-row"><span class="st ' + (c.pass ? "ok" : "bad") + '">' + (c.pass ? "PASS" : "FAIL") + '</span>'
      + '<span>' + L(c.name) + (c.note ? ' <span style="opacity:.6">— ' + L(c.note) + '</span>' : '') + '</span></div>';
  });
  document.getElementById("isoRows").innerHTML = s;
  document.getElementById("iso").classList.add("on");
  render();
}
function closeIso(){ document.getElementById("iso").classList.remove("on"); }

seedSky("skyWelcome", 60); seedSky("skyReveal", 36); seedSky("skyHandoff", 26);
render();

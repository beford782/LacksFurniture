<!doctype html>
<!--
  Sleep Brief — RECOMMENDED CANDIDATE (A-derived). PROTOTYPE ONLY.
  Phase 1 decision-package research artifact. Renders frozen engine output
  captured from main = 78f949c (see ../fixtures/PROVENANCE.md). Never imported,
  linked or executed by the production application. Nothing here recomputes,
  re-orders, filters, caps or synthesises engine output.

  Derivation (external-review correction pass, 2026-08-07): Alternative A's
  need-led hero, compact shared-view composition, exact firmness presentation,
  engine-ordered priorities, landscape structure and persistent action access
  — combined with Alternative B's always-visible "Try this:" testing guidance
  and visible category labels on the signal badges. The first-visit screen
  carries NO Compare entry (production's Sleep Brief has none; the working
  saved-finalist Compare entry belongs to the Consultation Summary, out of
  this package's scope). See VARIANT-NOTES.md.

  View over HTTP from the repo root, e.g.:
    python -m http.server 8000
    http://localhost:8000/prototypes/phase1-decision-package/sleep-brief-recommended/?scenario=dense-c&lang=en
-->
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="google" content="notranslate">
<!-- notranslate: Chrome auto-translate mangled a Spanish review screenshot into pseudo-English; the review surface must never be machine-translated -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep Brief — recommended candidate (prototype)</title>
  <link rel="stylesheet" href="../shared/harness.css">
  <link rel="stylesheet" href="sbr.css">
</head>
<body>
  <!-- The shared harness inserts the review bar (scenario/language switch)
       before this element at load time. -->

  <main class="sbr" id="sbrMain" aria-labelledby="sbrHeroTitle">

    <!-- ===== Need-led hero: priorities[0] BY INDEX becomes the headline ===== -->
    <header class="sbr-hero">
      <p class="sbr-eyebrow" id="sbrEyebrow"></p>
      <h1 class="sbr-hero__title" id="sbrHeroTitle"></h1>
      <p class="sbr-hero__lede" id="sbrHeroLede"></p>

      <!-- Inert signal badges (GOV.UK-status-tag family) with VISIBLE
           category labels (dl: dt = category, dd = value). Fixed invariant
           order: position, temperature, sharing, feel, size. Unanswered or
           unmapped signals are omitted, never placeholdered. NEVER
           health-adjacent answers. -->
      <dl class="sbr-badges" id="sbrBadges"></dl>

      <!-- Firmness: 10 discrete segments, exact integer, word from the
           Brief's own captured vocabulary (metaStrip "Feel" value). The
           graphic + visible fragments are one aria-hidden block; the sr-only
           sentence is the single accessible rendering. -->
      <div class="sbr-firm" id="sbrFirm"></div>
    </header>

    <div class="sbr-columns">

      <!-- ===== Priorities: 1-3 rows, engine order, <ol> semantics.
           "Try this:" testing guidance ALWAYS VISIBLE (adopted from
           Alternative B per the progressive-disclosure evidence). ===== -->
      <section class="sbr-priorities" aria-labelledby="sbrPrioritiesHeading">
        <h2 class="sbr-h2" id="sbrPrioritiesHeading"></h2>
        <p class="sbr-basis" id="sbrBasis"></p>
        <!-- role="list" restores list semantics under list-style:none -->
        <ol class="sbr-priority-list" id="sbrPriorityList" role="list"></ol>
        <p class="sbr-reassure" id="sbrReassure"></p>
      </section>

      <!-- ===== Next-step rail: the three journey steps, verbatim ===== -->
      <section class="sbr-journey" aria-labelledby="sbrJourneyHeading">
        <h2 class="sbr-h2" id="sbrJourneyHeading"></h2>
        <!-- role="list" restores list semantics under list-style:none -->
        <ol class="sbr-journey-list" id="sbrJourneyList" role="list"></ol>
        <p class="sbr-journey-copy" id="sbrJourneyCopy"></p>
      </section>

    </div>

    <!-- Prototype-chrome legend for the proposed-copy marking (dotted
         underline). Chrome, not product copy. -->
    <p class="sbr-legend" id="sbrLegend" data-prototype-chrome=""></p>

    <!-- ===== Actions (sticky). Primary: See My Matches (proposed honest
         navigation label). Secondary: the production Edit-answers entry,
         verbatim from the fixture. NO Compare entry on the first-visit
         Sleep Brief — there are no saved finalists yet, and production's
         saved-finalist Compare belongs to the Consultation Summary. ===== -->
    <div class="sbr-actions">
      <div class="sbr-actions__row">
        <button type="button" class="sbr-btn sbr-btn--ghost" id="sbrEditBtn"
                aria-describedby="sbrSimCaption"></button>
        <button type="button" class="sbr-btn sbr-btn--primary" id="sbrCtaBtn"
                aria-describedby="sbrSimCaption"></button>
      </div>
      <p class="sbr-sim-caption" id="sbrSimCaption" data-prototype-chrome=""></p>
    </div>

  </main>

  <script src="../shared/harness.js"></script>
  <script src="sbr.js"></script>
</body>
</html>
